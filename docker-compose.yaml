services:
   app:
       build:
           context: .
       env_file:
           - .env
       ports:
           - "8000:8000"
       volumes:
           - ./:/app
           - my_media:/files/media
           - my_static:/files/static
       depends_on:
           - db


   db:
       image: postgres:18.1
       restart: always
       env_file:
           - .env
       ports:
           - "5432:5432"

       volumes:
           - my_db:/var/lib/postgresql

volumes:
    my_db:
    my_media:
    my_static:

